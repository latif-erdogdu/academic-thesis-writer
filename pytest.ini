[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers -m "not live" --cov=tools --cov-fail-under=90
markers =
    live: Canli ag cagrisi gerektiren test (varsayilan olarak dislanir;
         calistirmak icin: pytest -m live)
